# Defaults for scripts/match.sh. Every value can be overridden by a flag.

HOST=ajs-mac-studio            # tailscale host running cutechess-cli
REMOTE_DIR=arpeggio-match      # relative to the Mac's $HOME

GAMES=100                      # games per pairing (rounded up to even: each opening is played with both colours)
TC=10+0.1                      # cutechess time control: moves/time+inc, e.g. 40/60, 5+0.05, inf
CONCURRENCY=8                  # games in parallel (Mac Studio has 14 cores)
BOOK=8moves_v3.pgn             # file in $REMOTE_DIR/openings, or a local path (uploaded); "none" = startpos only
BOOK_PLIES=16                  # max plies to take from each book line
TOURNAMENT=round-robin         # round-robin | gauntlet (first engine plays everyone else)
